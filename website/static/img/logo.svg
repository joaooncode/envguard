<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5DFF"/>
      <stop offset="50%" stop-color="#6A42C2"/>
      <stop offset="100%" stop-color="#563A9C"/>
    </linearGradient>
    <linearGradient id="creamGrad" x1="40" y1="35" x2="80" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="100%" stop-color="#FFF7D1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8B5DFF" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Shield Glow -->
  <path d="M60 10 C88 10 102 24 102 48 C102 80 60 108 60 108 C60 108 18 80 18 48 C18 24 32 10 60 10 Z"
        fill="url(#shieldGrad)"
        filter="url(#glow)"/>

  <!-- Inner Shield Border -->
  <path d="M60 18 C82 18 94 29 94 48 C94 74 60 98 60 98 C60 98 26 74 26 48 C26 29 38 18 60 18 Z"
        fill="#151126"
        opacity="0.95"/>

  <!-- Keyhole / Lock Body (Cream / Pale Gold) -->
  <circle cx="60" cy="50" r="12" fill="url(#creamGrad)"/>
  <path d="M54 50 L66 50 L69 76 C69 78 67 80 65 80 L55 80 C53 80 51 78 51 76 Z" fill="url(#creamGrad)"/>
  
  <!-- Lock Core (Deep Purple) -->
  <circle cx="60" cy="50" r="5" fill="#563A9C"/>
  <rect x="58" y="50" width="4" height="12" rx="2" fill="#563A9C"/>
  
  <!-- Subtle Dot Light Accent -->
  <circle cx="78" cy="36" r="3" fill="#FFF7D1" opacity="0.8"/>
</svg>